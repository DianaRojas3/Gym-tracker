<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header style="padding:20px">
        <h1>🏋️ Gym Tracker</h1>
    </header>

    <main style="padding:20px; max-width:320px;">
        <label for="userSelector">Perfil:</label>
        <select id="userSelector" style="display:block; margin:10px 0; width:100%;">
            <option value="didi">Didi</option>
            <option value="jari">Jari</option>
        </select>

        <button id="loginBtn" type="button">Entrar</button>
    </main>

    <script src="js/storage.js"></script>
    <script>
        const selector = document.getElementById("userSelector");
        const savedUser = localStorage.getItem("currentUser");

        if (savedUser) {
            selector.value = savedUser;
        }

        document.getElementById("loginBtn").addEventListener("click", () => {
            const user = selector.value;
            setCurrentUser(user);
            window.location.href = "plano.html";
        });
    </script>
</body>
</html>
