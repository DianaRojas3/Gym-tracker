<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gym Tracker</title>

<link rel="stylesheet"
      href="css/main.css">

</head>

<body>

<header>

<h1>🏋️ Gym Tracker</h1>

<div>

<label>Perfil:</label>

<select id="userSelector">

<option value="didi">
Didi
</option>

<option value="jari">
Jari
</option>

</select>

</div>

</header>

<div id="gym"></div>

<div id="modal"
     class="modal">

<div class="modal-content">

<h2 id="machineTitle"></h2>

<input
id="peso"
type="number"
placeholder="Peso (kg)">


<textarea
id="notas"
placeholder="Notas"></textarea>

<button id="saveBtn">
Guardar
</button>

<button id="closeBtn">
Cerrar
</button>

<hr>

<div id="history"></div>

</div>

</div>

<script src="js/machines.js"></script>

<script src="js/storage.js"></script>

<script src="js/app.js"></script>

</body>

</html>
