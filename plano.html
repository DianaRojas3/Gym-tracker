<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div id="welcome"></div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="historial.html">Historial</a>
            <a href="objetivos.html">Objetivos</a>
        </nav>
    </header>

    <div id="gym"></div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 id="machineTitle"></h2>

            <input id="peso" type="number" placeholder="Peso (kg)">
            <input id="series" type="number" placeholder="Series">
            <input id="reps" type="number" placeholder="Repeticiones">
            <textarea id="notes" placeholder="Notas"></textarea>

            <button type="button" onclick="saveCurrentWorkout()">Guardar</button>
            <button type="button" onclick="closeModal()">Cerrar</button>

            <div id="history"></div>
        </div>
    </div>

    <script src="js/machines.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/plano.js"></script>
</body>
</html>
